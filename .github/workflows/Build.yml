name: Build PaperScan Pro APK

on:
  # Run automatically whenever a commit is pushed to any branch.
  push:
  # Also allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paperscan-build-${{ github.ref }}
  # Keep the active build running; newer pushes wait instead of cancelling it.
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract App.zip and locate Flutter project
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "App.zip" ]; then
            echo "ERROR: App.zip was not found in the repository root."
            echo "Upload App.zip beside the .github folder."
            exit 1
          fi

          mkdir -p app_source
          unzip -oq App.zip -d app_source

          PUBSPEC="$(find app_source -maxdepth 4 -type f -name pubspec.yaml -print -quit)"
          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml was not found inside App.zip."
            echo "The ZIP must contain the Flutter project files."
            exit 1
          fi

          APP_DIR="$(dirname "$PUBSPEC")"
          if [ ! -d "$APP_DIR/lib" ]; then
            echo "ERROR: Flutter lib directory is missing: $APP_DIR/lib"
            exit 1
          fi

          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "Flutter project found at: $APP_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        working-directory: ${{ steps.extract.outputs.app_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.paperscan --project-name paper_scan_pro .
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
          fi

      - name: Get Flutter dependencies
        working-directory: ${{ steps.extract.outputs.app_dir }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ steps.extract.outputs.app_dir }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaperScan-Pro-APK
          path: ${{ steps.extract.outputs.app_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
